<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs></defs><rect width="1600" height="900" fill="#ffffff"/><text x="800" y="66.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#6d5ef5" text-anchor="middle">Why you can trust it</text><polyline points="60,130 400,130 400,452.4 230,650 60,452.4 60,130" fill="#fff4e6" stroke="#f08c00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="230" cy="186" rx="28" ry="28" fill="#f08c00" stroke="#f08c00" stroke-width="2"/><text x="230" y="195.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="230" y="276.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e1e2e" text-anchor="middle">You set the limits</text><text x="230" y="335.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#495057" text-anchor="middle">Your risk comfort,</text><text x="230" y="363.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#495057" text-anchor="middle">favourite coins and the</text><text x="230" y="390.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#495057" text-anchor="middle">size that needs your OK.</text><polyline points="440,130 780,130 780,452.4 610,650 440,452.4 440,130" fill="#ffe3e3" stroke="#e03131" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="610" cy="186" rx="28" ry="28" fill="#e03131" stroke="#e03131" stroke-width="2"/><text x="610" y="195.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="610" y="276.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e1e2e" text-anchor="middle">Hard safety rules</text><text x="610" y="335.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#495057" text-anchor="middle">Size, loss and exposure</text><text x="610" y="363.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#495057" text-anchor="middle">limits written as code.</text><text x="610" y="390.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#495057" text-anchor="middle">The AI cannot override.</text><polyline points="820,130 1160,130 1160,452.4 990,650 820,452.4 820,130" fill="#eef0ff" stroke="#6d5ef5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="990" cy="186" rx="28" ry="28" fill="#6d5ef5" stroke="#6d5ef5" stroke-width="2"/><text x="990" y="195.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="990" y="276.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e1e2e" text-anchor="middle">Everything is shown</text><text x="990" y="335.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#495057" text-anchor="middle">The Trace page tells</text><text x="990" y="363.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#495057" text-anchor="middle">the story of every idea,</text><text x="990" y="390.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#495057" text-anchor="middle">step by step.</text><polyline points="1200,130 1540,130 1540,452.4 1370,650 1200,452.4 1200,130" fill="#ffe3e3" stroke="#e03131" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="1370" cy="186" rx="28" ry="28" fill="#e03131" stroke="#e03131" stroke-width="2"/><text x="1370" y="195.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1370" y="276.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e1e2e" text-anchor="middle">Emergency stop</text><text x="1370" y="335.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#495057" text-anchor="middle">One button halts all</text><text x="1370" y="363.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#495057" text-anchor="middle">new trades right away.</text><text x="800" y="848.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#495057" text-anchor="middle">Practice money only. Nothing moves without passing the rules, and big trades wait for your Approve.</text></svg>
